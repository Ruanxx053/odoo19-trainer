<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Odoo 19 认证训练器</title>
<link rel="stylesheet" href="app.css">

<!-- 手机 / PWA：添加到主屏幕后可全屏离线使用 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6a4bd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Odoo训练器">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand">Odoo 19 认证训练器</div>
  <nav id="tabs" class="tabs"></nav>
  <div class="hdr-meta" id="hdrMeta"></div>
</header>
<main id="view" class="view"></main>
<div id="toast" class="toast"></div>
<script src="bank.js"></script>
<script src="tutorials.js"></script>
<script src="mermaid.min.js" onerror="window.__mermaidMissing=1"></script>
<script src="app.js"></script>
<script>
/* 离线缓存：只有通过 http(s) 打开时才注册（file:// 不支持 Service Worker，会安静跳过）。
   updateViaCache:"none" 让浏览器每次都绕过 HTTP 缓存去查新版 sw.js；
   新 SW 接管后自动刷新一次，避免"改了代码但手机/电脑还是旧的"。 */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
    .then(function (reg) { try { reg.update(); } catch (e) {} })
    .catch(function () {});
  var swReloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hadController || swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}
</script>
</body>
</html>
